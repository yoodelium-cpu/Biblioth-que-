<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibliothèque">
<title>Bibliothèque</title>
<style>
:root{--bg:#14161f;--panel:#1e2133;--tx:#eceaf4;--mut:#8d92a8;--ac:#7aa2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 8px 6px;padding-top:calc(10px + env(safe-area-inset-top))}
h1{font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
#st{font-size:12px;color:var(--mut);font-weight:400}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--panel);color:var(--tx);padding:7px 12px;border-radius:99px;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:#10131f;font-weight:600}
.tools{display:flex;gap:6px}
.tools select,.tools input{flex:1;min-width:0;background:var(--panel);color:var(--tx);border:0;border-radius:10px;padding:8px;font:inherit;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:4px 5px 24px}
.pb{position:absolute;top:3px;right:3px;background:#e8b339;color:#10131f;font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px}
.c{position:relative;background:var(--panel);border:0;padding:0;border-radius:5px;overflow:hidden;aspect-ratio:2/3;color:var(--tx)}
.c img{width:100%;height:100%;object-fit:cover;display:block}
#more{display:block;margin:0 auto 30px;padding:10px 20px}
#m{position:fixed;inset:0;background:rgba(10,11,18,.7);display:none;z-index:10}
#m.on{display:block}
#sh{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#sh h2{margin:0 28px 4px 0;font-size:19px}
#x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);font-size:28px}
.meta{color:var(--mut);font-size:13px;margin-bottom:8px}
.play{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.play a{background:var(--ac);color:#10131f;text-decoration:none;font-weight:600;padding:9px 14px;border-radius:10px}
#ov{font-size:14px}
#sn{width:100%;background:var(--bg);color:var(--tx);border:0;border-radius:10px;padding:9px;margin:8px 0;font:inherit}
ol{margin:0;padding-left:22px;font-size:14px}
ol li{padding:3px 0}
</style>
</head>
<body>
<header>
<h1>Bibliothèque <span id="st"></span></h1>
<div class="row" id="types"></div>
<div class="tools"><select id="gen"></select><select id="pl"></select><input id="q" type="search" placeholder="Rechercher"></div>
</header>
<main><div id="grid"></div><button class="chip" id="more" hidden>Voir plus</button></main>
<div id="m"><div id="sh"><button id="x" aria-label="Fermer">×</button><div id="d"></div></div></div>
<script>
const KEY='ebf6505c06224a838d05e434ceba53a3',B='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/';
const PROV={8:'Netflix',119:'Prime Video',337:'Disney+',283:'Crunchyroll',415:'ADN'};
const APPS={8:'netflix://',119:'primevideo://',337:'disneyplus://',283:'crunchyroll://',415:null};
const WEB={8:'https://www.netflix.com/',119:'https://www.primevideo.com/',337:'https://www.disneyplus.com/',283:'https://www.crunchyroll.com/',415:'https://animationdigitalnetwork.com/'};
const TYPES=[['all','Tout'],['movie','Films'],['animovie','Films animés'],['anitv','Séries animées'],['tv','Séries']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lib=[],genres={},f={t:'all',g:'',p:'',q:''},shown=60;
try{const c=JSON.parse(localStorage.getItem('lib')||'null');if(c){lib=c.lib;genres=c.genres}}catch(e){}

async function api(path,p={}){
  const u=new URL(B+path);
  u.search=new URLSearchParams({api_key:KEY,language:'fr-FR',...p});
  const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();
}
async function refresh(){
  $('st').textContent='Mise à jour…';
  try{
    const gs={};
    for(const t of['movie','tv'])(await api('/genre/'+t+'/list')).genres.forEach(g=>gs[g.id]=g.name);
    const jobs=[];
    for(const t of['movie','tv'])for(const p of Object.keys(PROV))for(let n=1;n<=3;n++)
      jobs.push(api('/discover/'+t,{with_watch_providers:p,watch_region:'FR',with_watch_monetization_types:'flatrate',sort_by:'popularity.desc',page:n})
        .then(r=>r.results.filter(x=>x.poster_path).map(x=>({id:x.id,t,n:x.title||x.name,p:x.poster_path,g:x.genre_ids,pr:[+p]})))
        .catch(()=>[]));
    const map=new Map();
    (await Promise.all(jobs)).flat().forEach(x=>{
      const k=x.t+x.id,o=map.get(k);
      if(o){if(!o.pr.includes(x.pr[0]))o.pr.push(x.pr[0])}else map.set(k,x);
    });
    const paidJobs=[];
    for(const t of['movie','tv'])for(const m of['rent','buy'])for(let n=1;n<=2;n++)
      paidJobs.push(api('/discover/'+t,{with_watch_monetization_types:m,watch_region:'FR',sort_by:'popularity.desc',page:n})
        .then(r=>r.results.filter(x=>x.poster_path).map(x=>({id:x.id,t,n:x.title||x.name,p:x.poster_path,g:x.genre_ids,pr:[],paid:true})))
        .catch(()=>[]));
    (await Promise.all(paidJobs)).flat().forEach(x=>{const k=x.t+x.id;if(!map.has(k))map.set(k,x)});
    if(map.size){lib=[...map.values()];genres=gs;
      try{localStorage.setItem('lib',JSON.stringify({lib,genres}))}catch(e){}}
    $('st').textContent='À jour à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){$('st').textContent='Hors ligne : liste enregistrée'}
  menus();render();
}
const kind=x=>x.t==='movie'?(x.g.includes(16)?'animovie':'movie'):(x.g.includes(16)?'anitv':'tv');
function menus(){
  $('types').innerHTML=TYPES.map(([k,l])=>`<button class="chip${f.t===k?' on':''}" data-t="${k}">${l}</button>`).join('');
  const ids=new Set(lib.flatMap(x=>x.g));
  $('gen').innerHTML='<option value="">Tous les genres</option>'+[...ids].filter(i=>genres[i]).sort((a,b)=>genres[a].localeCompare(genres[b])).map(i=>`<option value="${i}"${+f.g===i?' selected':''}>${esc(genres[i])}</option>`).join('');
  $('pl').innerHTML='<option value="">Tous mes abonnements</option>'+Object.entries(PROV).map(([i,n])=>`<option value="${i}"${+f.p===+i?' selected':''}>${n}</option>`).join('');
}
function render(){
  const q=f.q.toLowerCase();
  const l=lib.filter(x=>(f.t==='all'||kind(x)===f.t)&&(!f.g||x.g.includes(+f.g))&&(!f.p||x.pr.includes(+f.p))&&(!q||x.n.toLowerCase().includes(q)));
  $('grid').innerHTML=l.slice(0,shown).map(x=>`<button class="c" data-k="${x.t}${x.id}"><img loading="lazy" src="${IMG}w185${x.p}" alt="${esc(x.n)}">${x.paid?'<span class="pb">€</span>':''}</button>`).join('')||'<p style="grid-column:1/-1;color:var(--mut);padding:20px">Aucun titre. Change les filtres ou attends la mise à jour.</p>';
  $('more').hidden=l.length<=shown;
}
$('types').onclick=e=>{const b=e.target.closest('[data-t]');if(b){f.t=b.dataset.t;shown=60;menus();render()}};
$('gen').onchange=e=>{f.g=e.target.value;shown=60;render()};
$('pl').onchange=e=>{f.p=e.target.value;shown=60;render()};
$('q').oninput=e=>{f.q=e.target.value;shown=60;render()};
$('more').onclick=()=>{shown+=60;render()};
const APPS_OPEN=async e=>{
  const a=e.target.closest('[data-app]');if(!a)return;e.preventDefault();
  const i=a.dataset.app;
  try{await navigator.clipboard.writeText(a.dataset.title);$('cp').textContent='Titre copié : « '+a.dataset.title+' ». Colle-le dans la recherche de l\'appli.'}catch(_){}
  const t=Date.now();
  if(APPS[i]){
    location.href=APPS[i];
    setTimeout(()=>{if(Date.now()-t<1500&&!document.hidden)location.href=WEB[i]},1000);
  }else location.href=WEB[i];
};
$('x').onclick=()=>$('m').classList.remove('on');
$('m').onclick=e=>{if(e.target.id==='m')$('m').classList.remove('on')};
$('grid').onclick=async e=>{
  const b=e.target.closest('.c');if(!b)return;
  const x=lib.find(i=>i.t+i.id===b.dataset.k);
  $('m').classList.add('on');
  $('d').innerHTML=`<h2>${esc(x.n)}</h2><div class="meta">Chargement…</div>`;
  try{
    const [d,wp]=await Promise.all([api('/'+x.t+'/'+x.id),api('/'+x.t+'/'+x.id+'/watch/providers')]);
    const dur=x.t==='movie'?d.runtime:(d.episode_run_time||[])[0];
    const meta=[(d.release_date||d.first_air_date||'').slice(0,4),x.t==='tv'?d.number_of_seasons+' saison'+(d.number_of_seasons>1?'s':''):'',dur?(x.t==='movie'?'Durée ':'Épisode ')+dur+' min':''].filter(Boolean).join(' · ');
    const fr=(wp.results||{}).FR||{};
    const inc=(fr.flatrate||[]).filter(p=>PROV[p.provider_id]);
    const play=inc.map(p=>`<a href="#" data-app="${p.provider_id}" data-title="${esc(x.n)}">Ouvrir ${PROV[p.provider_id]}</a>`).join('');
    const buy=[...(fr.rent||[]),...(fr.buy||[])].map(p=>p.provider_name).filter((v,i,a)=>a.indexOf(v)===i);
    const info=inc.length?'Inclus dans ton abonnement, sans supplément.':'Payant : pas inclus dans tes abonnements.';
    const paidInfo=(!inc.length&&buy.length)?'Supplément à payer (location ou achat) sur : '+buy.join(', ')+'. Le montant n\'est pas disponible dans les données.':'';
    const bd=d.backdrop_path?`<img src="${IMG}w780${d.backdrop_path}" alt="" style="width:100%;border-radius:10px;margin-bottom:10px">`:'';
    $('d').innerHTML=bd+`<h2>${esc(x.n)}</h2><div class="meta">${esc(meta)}</div><div class="meta">${esc(info)}</div>${paidInfo?`<div class="meta">${esc(paidInfo)}</div>`:''}${play?`<div class="play">${play}</div><div class="meta" id="cp">Le titre sera copié au clic, colle-le dans la recherche de l'appli.</div>`:''}<p id="ov">${esc(d.overview||'Pas de résumé en français.')}</p>`
      +(x.t==='tv'?`<select id="sn">${(d.seasons||[]).filter(s=>s.season_number>0).map(s=>`<option value="${s.season_number}">Saison ${s.season_number} (${s.episode_count} épisodes)</option>`).join('')}</select><ol id="ep"></ol>`:'');
    $('d').onclick=APPS_OPEN;
    if(x.t==='tv'){
      const load=async()=>{
        const n=$('sn').value;if(!n)return;$('ep').innerHTML='<li>Chargement…</li>';
        try{const s=await api('/tv/'+x.id+'/season/'+n);
          $('ep').innerHTML=s.episodes.map(v=>`<li value="${v.episode_number}">${esc(v.name)}${v.runtime?' ('+v.runtime+' min)':''}</li>`).join('')}
        catch(e){$('ep').innerHTML='<li>Épisodes indisponibles.</li>'}
      };
      $('sn').onchange=load;load();
    }
  }catch(e){$('d').innerHTML=`<h2>${esc(x.n)}</h2><div class="meta">Détails indisponibles. Vérifie ta connexion.</div>`}
};
menus();render();refresh();
</script>
</body>
</html>
